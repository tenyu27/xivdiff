# Deployed into the `xivdiff` Cloudflare account, so the account subdomain
# already carries the project name: https://fflogs-proxy.xivdiff.workers.dev
#
# Changing this does not rename the Worker — Cloudflare creates a new one, and
# secrets do not follow. Re-run `wrangler secret put` and delete the old Worker.
name = "fflogs-proxy"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# FFLOGS_CLIENT_ID and FFLOGS_CLIENT_SECRET are secrets, never vars:
#   wrangler secret put FFLOGS_CLIENT_ID
#   wrangler secret put FFLOGS_CLIENT_SECRET

[vars]
# Comma-separated origin allowlist, so the proxy cannot be used as an open relay
# against the account's FFLogs quota. Empty would allow any origin.
ALLOWED_ORIGINS = "https://xivdiff.com,https://www.xivdiff.com"
