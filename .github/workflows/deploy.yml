name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The worker deploys from its own workflow; changing it alone should not
    # rebuild and republish the site.
    paths-ignore:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - run: yarn lint

      - run: yarn build
        env:
          # Set this repository variable to the deployed worker's URL.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      # The app uses hash routing, so no 404.html fallback is needed.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
