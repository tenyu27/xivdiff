<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    xivdiff. A crystal cut down its own axis, the two halves knocked out of
    line: the game's oldest shape, split the way a diff splits a file. The
    halves are the product's own two verdicts — agreement green, divergence
    amber — and the stagger between them is the finding.
  -->
  <style>
    .a { stroke: #16a34a; fill: #16a34a; }
    .b { stroke: #e59500; fill: #e59500; }
    @media (prefers-color-scheme: dark) {
      .a { stroke: #63ad58; fill: #63ad58; }
      .b { stroke: #d8bb2e; fill: #d8bb2e; }
    }
  </style>
  <g fill-opacity=".16" stroke-width="2" stroke-linejoin="round">
    <path class="a" d="M16 5 8 11v10l8 6z" transform="translate(0 -1.5)" />
    <path class="b" d="M16 5l8 6v10l-8 6z" transform="translate(0 1.5)" />
  </g>
</svg>
